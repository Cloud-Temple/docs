name: CI/CD Documentation

# Flux : branche de travail → PR vers staging → PR vers production.
# - Toute branche et toute PR : contrôles + build (aucun secret exposé).
# - staging    : publication différentielle du site dans le bucket docs-staging
#                (les données roadmap-data/ sont publiées par un dépôt dédié).
# - production : publication dans docs-production, après approbation
#                (règle de protection de l'environment GitHub « production »).
# - tags X.Y.Z : image Docker versionnée + latest (le commit est déjà publié sur S3).
# Le build exécute du code npm tiers : il ne reçoit jamais les clés S3 ni
# DockerHub, qui ne sont visibles que des jobs de publication.

on:
  push:
    branches: ["**"]
    # Convention des releases : 3.32.0 (sans « v ») ; v3.32.0 accepté aussi.
    tags: ["[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: [staging, production]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  BOTO3_VERSION: "1.44.3"

jobs:
  # Contrôles légers, sans dépendances : bloquent tout le reste.
  guards:
    name: Contrôles (admonitions, secrets, scripts de déploiement)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Syntaxe Docusaurus 2 (`:::type Titre`) rendue en texte brut par MDX v3.
      - name: Admonitions MDX v3
        run: python3 scripts/check_admonitions.py

      # Dépôt PUBLIC : bloque aussi les marqueurs de conflit commités.
      - name: Absence de secrets et de marqueurs de conflit
        run: python3 scripts/check_secrets.py

      - name: Tests des scripts de publication S3
        run: python3 -m unittest discover -s scripts/deploy -p 'test_*.py' -v

  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    needs: guards
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      site_url: ${{ steps.target.outputs.site_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historique complet : dates de mise à jour des pages, et empreintes
          # stables d'un build à l'autre (sinon tout est renvoyé sur S3).
          fetch-depth: 0

      - name: Environnement cible
        id: target
        run: |
          if [ "$GITHUB_REF" = "refs/heads/production" ] || [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "site_url=https://docs.cloud-temple.com" >> "$GITHUB_OUTPUT"
          else
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "site_url=https://docs-ng.c-t.tech" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: yarn

      - name: Dépendances
        run: yarn install --frozen-lockfile

      - name: Contrôle de types
        run: yarn typecheck

      - name: Tests des composants (roadmap, version du site)
        run: node --test src/components/Roadmap/*.test.mjs src/components/SiteVersion/*.test.mjs

      - name: Build Docusaurus (5 langues)
        env:
          BASE_URL: /
          SITE_URL: ${{ steps.target.outputs.site_url }}
          ROADMAP_DATA_URL: /roadmap-data/
          NO_UPDATE_NOTIFIER: "1"
        run: yarn build

      # Version affichée dans le footer : dérivée du commit, jamais de l'heure du
      # build, pour qu'une relance ne modifie aucun fichier sur S3.
      - name: Fichier de version
        run: python3 scripts/deploy/write_version.py --environment "${{ steps.target.outputs.environment }}" --ref "$GITHUB_REF_NAME" --output build/version.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: build/
          # Images PNG déjà compressées : la recompression coûte du temps pour rien.
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publication S3 (${{ needs.build.outputs.environment }})
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/production')
    environment:
      name: ${{ needs.build.outputs.environment }}
      url: ${{ needs.build.outputs.site_url }}
    # Jamais deux publications simultanées sur un même bucket.
    concurrency:
      group: publish-${{ needs.build.outputs.environment }}
      cancel-in-progress: false
    # Variables GitHub (non secrètes) : S3_BUCKET par environment, S3_ENDPOINT au
    # niveau du dépôt. Les clés restent des secrets d'environment.
    env:
      BUCKET: ${{ vars.S3_BUCKET }}
      S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
    steps:
      - name: Configuration de l'environment
        run: |
          [ -n "$BUCKET" ] || { echo "::error::Variable S3_BUCKET absente de l'environment ${{ needs.build.outputs.environment }}"; exit 1; }
          case "$S3_ENDPOINT" in https://*) ;; *) echo "::error::Variable S3_ENDPOINT absente ou non HTTPS"; exit 1;; esac
          echo "Publication vers $BUCKET via $S3_ENDPOINT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/deploy

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Client S3
        run: python3 -m pip install --quiet "boto3==${BOTO3_VERSION}"

      # L'artefact ne contient que le contenu de build/ (chemin unique à l'envoi) :
      # le replacer explicitement dans build/.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: build

      - name: Site statique (envoi différentiel)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: python3 scripts/deploy/s3_publish.py build --bucket "$BUCKET" --endpoint "$S3_ENDPOINT" --report s3-report.json

      # Vérification sans clé, comme un visiteur : pages servies en HTML et
      # données de roadmap présentes pour la page /roadmap.
      - name: Vérification publique
        run: |
          host="${S3_ENDPOINT#https://}"
          base="https://${BUCKET}.${host%/}"
          for page in home roadmap en/roadmap de/roadmap es/roadmap it/roadmap console/api; do
            headers="$(curl -sS -o /dev/null -D - --fail "$base/$page")" || { echo "::error::$page inaccessible"; exit 1; }
            echo "$headers" | tr -d ' ' | grep -qi '^content-type:text/html' || { echo "::error::$page n'est pas servi en text/html"; exit 1; }
          done
          # Les données de roadmap sont publiées par un dépôt dédié : vérifier seulement
          # que la page /roadmap les trouve.
          published="$(curl -sS --fail "$base/roadmap-data/manifest.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["release"])')" \
            || { echo "::error::données de roadmap introuvables sur $base/roadmap-data/"; exit 1; }
          echo "Pages vérifiées sur $base ; données de roadmap présentes (release $published)."

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: build
    # Pas d'image pour les PR : les secrets DockerHub n'y sont pas exposés.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # L'artefact ne contient que le contenu de build/ (chemin unique à l'envoi) :
      # le replacer explicitement dans build/.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: build

      - name: Tags de l'image
        id: tags
        run: |
          image=cloudtempleinfra/docs
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tags=$image:$GITHUB_REF_NAME,$image:latest" >> "$GITHUB_OUTPUT"
          else
            # Un tag Docker n'accepte que [A-Za-z0-9._-], 128 caractères au plus,
            # sans '.' ni '-' en tête ; les branches docs/..., fix/... contiennent des '/'.
            tag="$(printf '%s' "$GITHUB_REF_NAME" | sed -e 's/[^A-Za-z0-9._-]/-/g' -e 's/^[.-]/_/' | cut -c1-128)"
            echo "tags=$image:$tag" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/production/Dockerfile.prebuilt
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: ${{ steps.tags.outputs.tags }}
