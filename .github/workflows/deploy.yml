name: CI/CD Workflow

on:
  push:
    branches:
      - "*"
  create:
    tags:
      - "*"

jobs:
  # Job for the dev branch (GitHub Pages deployment)
  deploy-dev:
    name: Deploy Documentation to GitHub Pages
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'
    permissions:
      pages: write
      id-token: write
    environment: dev # Ensure this matches your GitHub environment name
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Documentation
        env:
          APP_VERSION: ${{ github.sha }}
        run: yarn build

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Job for feature branches (building and pushing an unversioned Docker image)
  build-branch:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' && !startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Documentation
        env:
          BASE_URL: "/"
          APP_VERSION: ${{ github.sha }}
        run: yarn build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Branch Name
        id: extract_branch
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          # Un tag Docker n'accepte que [A-Za-z0-9._-], ne peut pas commencer par '.' ou '-'
          # et fait 128 caracteres au maximum. La convention de branches du depot
          # (docs/..., fix/..., tech/...) contient des '/' : sans cette normalisation,
          # buildx echoue avec "invalid reference format".
          DOCKER_TAG="$(printf '%s' "$BRANCH_NAME" \
            | sed -e 's/[^A-Za-z0-9._-]/-/g' -e 's/^[.-]/_/' \
            | cut -c1-128)"
          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_ENV"
          echo "DOCKER_TAG=$DOCKER_TAG" >> "$GITHUB_ENV"

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/production/Dockerfile.prebuilt
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: cloudtempleinfra/docs:${{ env.DOCKER_TAG }}

  # Job for the main branch (building and pushing an unversioned Docker image)
  build-main:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Documentation
        env:
          BASE_URL: "/"
          APP_VERSION: ${{ github.sha }}
        run: yarn build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/production/Dockerfile.prebuilt
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: cloudtempleinfra/docs:main

  # Job for tags (building and pushing a versioned Docker image)
  build-tag:
    name: Build and Push Versioned Docker Image
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Documentation
        env:
          BASE_URL: "/"
          APP_VERSION: ${{ github.ref_name }}
        run: yarn build

      - name: Extract Tag Name
        id: extract_tag
        run: echo "TAG=${GITHUB_REF##*/}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/production/Dockerfile.prebuilt
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: |
            cloudtempleinfra/docs:${{ env.TAG }}
            cloudtempleinfra/docs:latest
